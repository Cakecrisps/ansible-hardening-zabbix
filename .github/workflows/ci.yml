name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: pip install "ansible-core>=2.16" "ansible-lint>=24.0"

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: ansible-lint playbook.yml
        # Пока проект молодой, лучше не блокировать CI из-за стилевых
        # предупреждений. Как только пройдёшься по замечаниям — убери
        # эту строку, чтобы lint реально проваливал сборку.
        continue-on-error: true

      - name: Syntax-check playbook
        run: ansible-playbook -i inventory.ini playbook.yml --syntax-check